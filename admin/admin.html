<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple admin panel UI</title>
  <link href="./css/admin.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter&display=swap" rel="stylesheet" />
</head>
<body class="body">
  <div class="container">
    <!-- Left panel -->
    <div class="left-panel">
      <h1 class="title">Bukid_craft<br/>admin<br/>panel</h1>
      <p class="version">ver 1.1.3</p>
      <p class="author">@anansi</p>
    </div>

    <!-- Right panel -->
    <div class="right-panel">
      <div class="header">
        <div class="company">
          <div class="company-icon">
            <i class="fas fa-building"></i>
          </div>
          <span class="company-name">Company</span>
        </div>
        <nav class="nav">
          <button class="nav-item"><i class="fas fa-home"></i><span>General</span></button>
          <button class="nav-item active"><i class="fas fa-user-friends"></i><span>Users</span></button>
          <button class="nav-item"><i class="fas fa-chart-bar"></i><span>Statistic</span></button>
          <button class="nav-item"><i class="fas fa-file-invoice-dollar"></i><span>Billing</span></button>
        </nav>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-number">12</span>
          <span class="stat-label">Peoples</span>
        </div>

      </div>

      <div class="search">
        <input type="search" placeholder="Search" />
      </div>

      <div class="filters">
        <select><option>All</option></select>
        <select><option>All Departments</option></select>
      </div>

      <div class="table-header">
        <div class="checkbox-col"><input type="checkbox" /></div>
        <div class="user-col">User</div>
        <div class="status-col">Status</div>
        <div class="phone-col">Phone number</div>
        <div class="position-col">Position</div>
      </div>

      <div class="table-body">
        <!-- Repeat this row -->
        <div class="table-row selected">
          <div class="checkbox-col"><input type="checkbox" checked /></div>
          <div class="user-col">
            <img src="https://storage.googleapis.com/a1aa/image/597d38c0-f0d6-40af-0469-82bebfc66e64.jpg" alt="Andrew Bojangles" />
            <span>Andrew Bojangles</span>
          </div>
          <div class="status-col">Active</div>
          <div class="phone-col">+79000010101</div>
          <div class="position-col">Designer</div>
        </div>
        <!-- End repeat -->
      </div>

      <div class="signout">
        <button><i class="fas fa-sign-out-alt"></i><span>Sign out</span></button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const navItems = document.querySelectorAll('.nav-item');
  
      navItems.forEach(item => {
        item.addEventListener('click', () => {
          navItems.forEach(btn => btn.classList.remove('active'));
          item.classList.add('active');
        });
      });
    });
  </script>
</body>
</html>
